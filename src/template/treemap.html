<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js Treemap</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .node {
            border: 1px solid #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>D3.js Cascaded Treemap</h1>
    <div id="treemap"></div>
    <script>
        const data = /* JSON data goes here */;

        const width = 800;
        const height = 600;

        const treemap = d3.treemap()
            .size([width, height])
            .padding(1);

        const root = d3.hierarchy(data)
            .sum(d => d.profile.total) // Use total as the value for the treemap
            .sort((a, b) => b.value - a.value);

        treemap(root);

        const svg = d3.select("#treemap")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        const nodes = svg.selectAll(".node")
            .data(root.leaves())
            .enter().append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x0},${d.y0})`);

        nodes.append("rect")
            .attr("id", d => d.data.name)
            .attr("width", d => d.x1 - d.x0)
            .attr("height", d => d.y1 - d.y0)
            .attr("fill", "#69b3a2");

        nodes.append("text")
            .attr("x", 4)
            .attr("y", 20)
            .text(d => d.data.name);
    </script>
</body>
</html>
