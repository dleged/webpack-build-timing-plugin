<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3.js Treemap</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    .node {
      border: 1px solid #fff;
      font: 10px sans-serif;
      overflow: hidden;
      position: absolute;
    }
  </style>
</head>

<body>
  <h1>Treemap Visualization</h1>
  <div id="treemap"></div>

  <script>
    const data = {
      "id": "./src/index.js",
      "name": "./src/index.js",
      "chunks": [
        "main"
      ],
      "profile": {

        "additionalResolving": 0,

        "dependencies": 0
      },
      "children": [
        {
          "id": "./src/static-esm-module.js",
          "name": "./src/static-esm-module.js",
          "chunks": [
            "main"
          ],
          "profile": {
            "total": 11,
            "resolving": 6,
            "restoring": 0,
            "building": 5,
            "integration": 0,
            "storing": 0,
            "additionalResolving": 0,
            "additionalIntegration": 0,
            "factory": 6,
            "dependencies": 0
          },
          "children": []
        },
        {
          "id": "./src/index.css",
          "name": "./src/index.css",
          "chunks": [
            "main"
          ],
          "profile": {
            "total": 266,
            "resolving": 14,
            "restoring": 0,
            "building": 252,
            "integration": 0,
            "storing": 0,
            "additionalResolving": 0,
            "additionalIntegration": 0,
            "factory": 14,
            "dependencies": 0
          },
          "children": []
        },
        {
          "id": null,
          "name": "css ./node_modules/.pnpm/css-loader@7.1.2/node_modules/css-loader/dist/cjs.js!./src/index.css",
          "chunks": [
            "main"
          ],
          "profile": {
            "total": 1,
            "resolving": 0,
            "restoring": 0,
            "building": 1,
            "integration": 0,
            "storing": 0,
            "additionalResolving": 0,
            "additionalIntegration": 0,
            "factory": 0,
            "dependencies": 0
          },
          "children": []
        },
        {
          "id": null,
          "name": "./src/index.css.webpack[javascript/auto]!=!./node_modules/.pnpm/css-loader@7.1.2/node_modules/css-loader/dist/cjs.js!./src/index.css",
          "chunks": [],
          "profile": {
            "total": 119,
            "resolving": 6,
            "restoring": 0,
            "building": 113,
            "integration": 0,
            "storing": 0,
            "additionalResolving": 0,
            "additionalIntegration": 0,
            "factory": 6,
            "dependencies": 0
          },
          "children": []
        }
      ]
    };
    // Load the JSON data from the stats.json file
    d3.json('stats.json').then(data => {
      // Set dimensions and create a Treemap layout
      const width = 960;
      const height = 500;

      const treemap = d3.treemap()
        .size([width, height])
        .padding(1);

      const root = d3.hierarchy(data)
        .sum(d => d.profile ? d.profile.total : 0); // Use total time as value

      treemap(root);

      const svg = d3.select("#treemap").append("svg")
        .attr("width", width)
        .attr("height", height);

      const nodes = svg.selectAll(".node")
        .data(root.leaves())
        .enter().append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x0},${d.y0})`);

      nodes.append("rect")
        .attr("id", d => d.data.name)
        .attr("width", d => d.x1 - d.x0)
        .attr("height", d => d.y1 - d.y0)
        .style("fill", "#69b3a2");

      nodes.append("text")
        .attr("x", 3)
        .attr("y", 20)
        .text(d => d.data.name);
    }).catch(error => {
      console.error("Error loading the JSON data:", error);
    });
  </script>
</body>

</html>
